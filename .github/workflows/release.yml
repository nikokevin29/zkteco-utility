name: Test, Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: '3.11'
  APP_NAME: ZKTeco_Utility

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1: Unit Tests (blocks build if fails)
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyzk openpyxl PySide6 pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest test_zkteco_app.py -v --tb=short \
            --cov=zkteco_app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2: Matrix build — Windows / Linux / macOS (tag or manual only)
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build (${{ matrix.os_label }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows
            artifact: ZKTeco_Utility_Windows
            exe_name: ZKTeco_Utility.exe
            icon_args: --icon app_icon.ico --add-data "app_icon.ico;." --add-data "app_icon.png;."
            data_sep: ';'
          - os: ubuntu-latest
            os_label: Linux
            artifact: ZKTeco_Utility_Linux
            exe_name: ZKTeco_Utility_Linux
            icon_args: --add-data "app_icon.png:."
            data_sep: ':'
          - os: macos-latest
            os_label: macOS
            artifact: ZKTeco_Utility_macOS
            exe_name: ZKTeco_Utility_macOS
            icon_args: --add-data "app_icon.png:."
            data_sep: ':'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux Qt system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyzk openpyxl PySide6 pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.exe_name }}" -replace '\.exe$',''
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name $name `
            --icon "app_icon.ico" `
            --add-data "app_icon.ico;." `
            --add-data "app_icon.png;." `
            --add-data "updater.py;." `
            --collect-all openpyxl `
            --collect-all zk `
            --collect-all PySide6 `
            --hidden-import openpyxl `
            --hidden-import openpyxl.styles `
            --hidden-import openpyxl.styles.fills `
            --hidden-import openpyxl.styles.fonts `
            --hidden-import openpyxl.styles.borders `
            --hidden-import openpyxl.styles.alignment `
            --hidden-import openpyxl.utils `
            --hidden-import openpyxl.worksheet `
            --hidden-import openpyxl.formatting `
            --hidden-import zk `
            --hidden-import zk.base `
            --hidden-import zk.exception `
            --hidden-import zk.user `
            --hidden-import zk.attendance `
            --hidden-import updater `
            --exclude-module pandas `
            --exclude-module numpy `
            --exclude-module scipy `
            --exclude-module matplotlib `
            --exclude-module sklearn `
            --exclude-module IPython `
            --exclude-module pytest `
            --exclude-module unittest `
            --exclude-module turtle `
            --exclude-module tkinter `
            zkteco_app.py

      - name: Build with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "${{ matrix.exe_name }}" \
            ${{ matrix.icon_args }} \
            --add-data "updater.py${{ matrix.data_sep }}." \
            --collect-all openpyxl \
            --collect-all zk \
            --collect-all PySide6 \
            --hidden-import openpyxl \
            --hidden-import openpyxl.styles \
            --hidden-import openpyxl.styles.fills \
            --hidden-import openpyxl.styles.fonts \
            --hidden-import openpyxl.styles.borders \
            --hidden-import openpyxl.styles.alignment \
            --hidden-import openpyxl.utils \
            --hidden-import openpyxl.worksheet \
            --hidden-import openpyxl.formatting \
            --hidden-import zk \
            --hidden-import zk.base \
            --hidden-import zk.exception \
            --hidden-import zk.user \
            --hidden-import zk.attendance \
            --hidden-import updater \
            --exclude-module pandas \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module matplotlib \
            --exclude-module sklearn \
            --exclude-module IPython \
            --exclude-module pytest \
            --exclude-module unittest \
            --exclude-module turtle \
            --exclude-module tkinter \
            zkteco_app.py

      - name: List dist output
        shell: bash
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe_name }}
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 3: Create GitHub Release (tag push only)
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: "ZKTeco Utility ${{ github.ref_name }}"
          body: |
            ## ZKTeco eFace10 Utility ${{ github.ref_name }}

            Desktop utility (PySide6) untuk mesin absen ZKTeco eFace10 — CV RAJ.

            ### Download
            | Platform | File |
            |----------|------|
            | Windows  | `ZKTeco_Utility.exe` |
            | Linux    | `ZKTeco_Utility_Linux` |
            | macOS    | `ZKTeco_Utility_macOS` |

            ### Install
            **Windows:** Download EXE, taruh di folder khusus (bukan Downloads), jalankan.
            **Linux:** `chmod +x ZKTeco_Utility_Linux && ./ZKTeco_Utility_Linux`
            **macOS:** `chmod +x ZKTeco_Utility_macOS && ./ZKTeco_Utility_macOS` (boleh perlu Right-click → Open)

            ### Fitur utama
            - Pull absensi + anomaly recovery (RTC eFace10)
            - Excel report + payroll CSV
            - Cloud sync ke VST-laravel
            - Silent mode (tray + autostart + auto pull/sync)
            - Weekly payroll grid (Minggu–Sabtu)

            ### From source
            ```bash
            pip install pyzk openpyxl PySide6
            python zkteco_app.py
            ```
          files: |
            artifacts/ZKTeco_Utility_Windows/ZKTeco_Utility.exe
            artifacts/ZKTeco_Utility_Linux/ZKTeco_Utility_Linux
            artifacts/ZKTeco_Utility_macOS/ZKTeco_Utility_macOS
          draft: false
          prerelease: false
          generate_release_notes: true
